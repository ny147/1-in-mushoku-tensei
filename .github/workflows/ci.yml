name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: six-faced-life

env:
  CI: true

jobs:
  validate:
    name: Test, build, and validate deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: six-faced-life/package-lock.json
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Test and build production assets
        run: npm run build:vercel
      - name: Check Vercel configuration syntax
        run: node -e "JSON.parse(require('node:fs').readFileSync('vercel.json', 'utf8'))"
      - name: Isolated dream warning desktop and phone walkthrough
        run: |
          python -m pip install --quiet selenium
          npm run dev -- --port 5174 > "$RUNNER_TEMP/dream-vite.log" 2>&1 &
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:5174/ >/dev/null && break; sleep 1; done
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.chrome.options import Options
          import json
          for lang,width,follow in [('en',1280,True),('th',390,False)]:
              options=Options()
              options.add_argument('--headless=new')
              options.add_argument('--disable-dev-shm-usage')
              with webdriver.Chrome(options=options) as browser:
                  browser.execute_cdp_cmd('Emulation.setDeviceMetricsOverride',dict(width=width,height=850,deviceScaleFactor=1,mobile=width<600))
                  browser.get('http://127.0.0.1:5174/')
                  seed=browser.execute_async_script("""
                    const [language, done] = arguments;
                    Promise.all([import('/src/game/expanded/origins.ts'),import('/src/game/storage.ts')]).then(([o,s])=>{
                      const l=o.createExpandedLife({seed:2,language});
                      Object.assign(l,{phase:'alive',age:35,pending:null});
                      delete l.expansion.social;
                      Object.assign(l.expansion.politics,{faction:'hitogami',trust:97});
                      s.saveGame(localStorage,{version:1,active:l,archive:[]}); done(true);
                    }).catch(e=>done(String(e)));
                  """,lang)
                  assert seed is True, seed
                  browser.refresh()
                  wait=WebDriverWait(browser,15)
                  def find(tag,label):
                      return wait.until(lambda d: next((e for e in d.find_elements(By.TAG_NAME,tag) if e.is_displayed() and e.text.startswith(label)),False))
                  def activity(label):
                      summary=find('summary','Optional activities' if lang=='en' else 'กิจกรรมที่เลือกทำได้')
                      if not summary.find_element(By.XPATH,'..').get_dom_attribute('open'): summary.click()
                      find('button',label).click()
                  def layout():
                      assert browser.execute_script('return document.documentElement.scrollWidth <= innerWidth + 1')
                      assert browser.execute_script("return [...document.querySelectorAll('.choice')].every(b=>b.scrollWidth <= b.clientWidth+1)")
                  activity('The Dream’s Warning' if lang=='en' else 'คำเตือนในฝัน')
                  pick=find('button','Stop the oil cart' if follow else 'ปล่อยให้เกวียนไปส่งของ')
                  layout()
                  pick.click()
                  browser.refresh()
                  activity('Read the ferry dispatch' if lang=='en' else 'อ่านข่าวจากท่าเรือ')
                  read=find('button','Record the dispatch' if lang=='en' else 'บันทึกข่าวจากท่าเรือ')
                  layout()
                  read.click()
                  result=wait.until(lambda d:d.find_element(By.CSS_SELECTOR,'.outcome-narrative').text)
                  assert ('candlelight' in result if follow else 'จับตัวเขาไป' in result),result
                  layout()
                  print('Verified',lang,width,'px, delivery, reload, dispatch and horizontal fit.')
          PY
      - name: Retain diagnostic build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: six-faced-life-dist
          path: six-faced-life/dist/
          if-no-files-found: error
          retention-days: 7
