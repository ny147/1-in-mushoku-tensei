name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: six-faced-life

env:
  CI: true

jobs:
  validate:
    name: Test, build, and validate deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: six-faced-life/package-lock.json
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Test and build production assets
        run: npm run build:vercel
      - name: Check Vercel configuration syntax
        run: node -e "JSON.parse(require('node:fs').readFileSync('vercel.json', 'utf8'))"
      - name: Retain diagnostic build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: six-faced-life-dist
          path: six-faced-life/dist/
          if-no-files-found: error
          retention-days: 7
